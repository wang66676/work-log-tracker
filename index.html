<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2557d6">
<title>工作日志跟进系统 · 可实操版</title>
<style>
:root{
  --bg:#f2f5fb; --card:#ffffff; --line:#e5eaf3; --text:#17233d; --muted:#6b7a99;
  --pri:#2557d6; --pri2:#1e46b8; --pri-bg:#eaf0ff;
  --ok:#12966b; --ok-bg:#e6f7f0; --warn:#d97706; --warn-bg:#fef3e2;
  --bad:#dc2626; --bad-bg:#fdeaea; --hold:#b45309; --gray:#5b6472;
  --radius:14px; --shadow:0 1px 3px rgba(23,35,61,.06),0 6px 18px rgba(23,35,61,.05);
  --nav-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;min-height:100vh}
a{color:var(--pri);text-decoration:none}
img{max-width:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
::placeholder{color:#9aa7bd}
/* ===== header ===== */
#topbar{position:sticky;top:0;z-index:60;background:linear-gradient(120deg,#2557d6,#3b6fe8);color:#fff;box-shadow:0 2px 10px rgba(37,87,214,.25)}
.top-inner{max-width:1100px;margin:0 auto;padding:0 16px;height:var(--nav-h);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;cursor:pointer;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:17px}
.brand small{font-weight:400;font-size:11px;opacity:.8;display:block;line-height:1.1}
.top-nav{display:none;gap:4px;margin-left:auto;align-items:center}
.top-nav a{color:#fff;opacity:.82;padding:7px 13px;border-radius:9px;font-size:14px;font-weight:500}
.top-nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
.top-nav a.on{opacity:1;background:rgba(255,255,255,.2);font-weight:600}
.top-act{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-act .btn-light{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.top-act .btn-light:hover{background:rgba(255,255,255,.26)}
/* ===== bottom nav mobile ===== */
#bottomNav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#bottomNav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;color:var(--muted);font-weight:500}
#bottomNav a .ic{font-size:20px;line-height:1}
#bottomNav a.on{color:var(--pri)}
#bottomNav a.on .ic{transform:translateY(-1px)}
/* ===== layout ===== */
#app{max-width:1100px;margin:0 auto;padding:18px 14px 90px}
#app.wide{padding-bottom:96px}
@media(min-width:820px){
  .top-nav{display:flex}
  .top-act .mobile-only{display:none}
  #bottomNav{display:none}
  #app{padding:22px 20px 40px}
  #fab{display:none!important}
}
@media(max-width:819px){
  .top-act .btn-plus{display:none}
  #topbar .desk-search{display:none}
}
/* ===== cards & rows ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card + .card{margin-top:0}
.card-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-title .sub{font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:12px}
.bold{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr);gap:12px;display:grid}}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.hide{display:none!important}
/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:600;background:#eef1f7;color:var(--text);transition:.15s;line-height:1.2}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:1px solid #f3c1c1}
.btn.bad.solid{background:var(--bad);color:#fff;border:none}
.btn.ghost{background:transparent;border:1px solid #d6deee;color:var(--pri)}
.btn.warn-ghost{background:#fff;color:var(--bad);border:1px solid #f0c9c9}
.btn.mini{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.danger-mini{padding:4px 9px;font-size:12px;border-radius:8px;background:#fff;color:var(--bad);border:1px solid #f0c9c9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{font-size:14px}
.btn-light{background:rgba(255,255,255,.92);color:var(--pri);font-weight:600}
.btn-block{width:100%}
.icon-btn{background:transparent;border:none;color:var(--muted);font-size:15px;padding:5px;border-radius:8px}
.icon-btn:hover{background:#f0f3fa;color:var(--text)}
/* ===== badges & chips ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.active{background:var(--pri-bg);color:var(--pri)}
.badge.doing{background:#eef2ff;color:#4f46e5}
.badge.hold{background:#fff7e6;color:var(--hold)}
.badge.cancelled{background:#eef0f4;color:var(--gray)}
.badge.done{background:var(--ok-bg);color:var(--ok)}
.badge.overdue{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.receivable{background:#e6f2fd;color:#0b6bcb}
.badge.payable{background:#fdecee;color:#d32f4b}
.badge.gray{background:#eef0f4;color:var(--gray)}
.badge.part{background:#fdf1e3;color:#c2610a}
.pri-chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
.pri-chip.high{background:var(--bad)}
.pri-chip.medium{background:var(--warn)}
.pri-chip.low{background:#94a3b8}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 6px;font-size:11px;min-width:16px;text-align:center}
.chip.on .n{background:rgba(255,255,255,.25)}
/* ===== forms ===== */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:#3c4a66;margin-bottom:5px}
.field label .req{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #d7deeb;border-radius:10px;padding:9px 11px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,87,214,.12)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.6}
.inp.sm{padding:6px 9px;font-size:14px}
.form-hint{font-size:12px;color:var(--muted);margin-top:4px}
.inline-lbl{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.inline-lbl input{width:17px;height:17px;accent-color:var(--pri)}
.seg{display:inline-flex;background:#eef1f7;border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(23,35,61,.12)}
@media(max-width:480px){.seg button{padding:6px 9px;font-size:13px}}
/* ===== tabs/pills ===== */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.pill.on .cnt{background:rgba(255,255,255,.25)}
.pill .cnt{background:#eef1f7;border-radius:999px;font-size:11px;padding:0 6px;min-width:15px;text-align:center}
.pill.bad-on{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.warn-on{background:var(--warn);border-color:var(--warn);color:#fff}
/* ===== lists ===== */
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid #eef1f7;cursor:pointer;transition:.12s}
.item:last-child{border-bottom:none}
.item:hover{background:#f8fafd}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;line-height:1.4;word-break:break-word}
.item .t.small{font-size:14px}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;color:var(--muted);font-size:12.5px;align-items:center}
.item .desc{color:#57647f;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.risk-hi{background:linear-gradient(135deg,#fdeaea,#fef1f0)!important;border-color:#f3c6c4!important}
.item.risk-hi .t{color:#b91c1c}
.risk-md{background:#fffaf0!important;border-color:#f4e2bd!important}
.hover-row{border-radius:10px}
.strike{text-decoration:line-through;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--pri-bg);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.listbox{border:1px solid var(--line);border-radius:12px;background:#fff;padding:2px 12px;overflow:hidden}
/* ===== stat cards ===== */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;box-shadow:var(--shadow);transition:.12s}
.stat:active{transform:scale(.98)}
.stat .v{font-size:25px;font-weight:800;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted);margin-top:1px}
.stat .l2{font-size:11px;color:var(--muted)}
.stat.blue{background:linear-gradient(135deg,#eaf0ff,#f7faff)}
.stat.green{background:linear-gradient(135deg,#e7f7f0,#f4fcf9)}
.stat.orange{background:linear-gradient(135deg,#fef3e2,#fffaf0)}
.stat.red{background:linear-gradient(135deg,#fdeaea,#fef6f5)}
.hero-banner{border-radius:var(--radius);padding:16px 18px;color:#fff;background:linear-gradient(120deg,#2557d6,#4f7df0);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-banner .v{font-size:30px;font-weight:800}
/* ===== tables ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
.tbl th{background:#f6f8fc;color:#52607a;font-size:12px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f3f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafbfe}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.paid-row{background:#f7faf8;color:var(--muted)}
/* ===== timeline ===== */
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#e2e8f4}
.tl-item{position:relative;padding:0 0 16px}
.tl-item:before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--pri);border:2px solid #fff;box-shadow:0 0 0 2px #d5e0f7}
.tl-item .time{font-size:11.5px;color:var(--muted)}
.tl-item .content{font-size:14px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
/* ===== progress ===== */
.progress{height:8px;border-radius:999px;background:#e8edf5;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#2557d6);transition:width .3s}
.progress.green>i{background:linear-gradient(90deg,#34d399,#12966b)}
.progress.orange>i{background:linear-gradient(90deg,#fbbf24,#d97706)}
/* ===== modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
@media(min-width:640px){.modal-mask{align-items:center;padding:20px}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 20px;animation:slideUp .18s}
@media(min-width:640px){.modal{border-radius:18px;padding:22px}}
.modal h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal .x{position:absolute}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-head h3{margin:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
/* ===== toast ===== */
#toastRoot{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
@media(min-width:820px){#toastRoot{bottom:30px}}
.toast{background:#17233d;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:slideUp .2s;max-width:88vw}
.toast.ok{background:#0f7a57}
.toast.bad{background:#c02a2a}
/* ===== fab ===== */
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:59;width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,#2557d6,#4f7df0);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(37,87,214,.4);line-height:1}
#fab:active{transform:scale(.95)}
/* ===== empty ===== */
.empty{text-align:center;padding:38px 16px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty .t{font-size:15px;font-weight:600;color:#44506a}
.empty .d{font-size:12.5px;margin-top:4px}
/* ===== 说明文字折叠 ===== */
body.no-notes .note-only{display:none!important}
/* ===== misc ===== */
.page-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-head h2{font-size:19px;font-weight:800}
.page-head .sub{font-size:12.5px;color:var(--muted)}
.section-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.section-t .ln{flex:1;height:1px;background:var(--line)}
.searchbox{position:relative;flex:1;min-width:180px;max-width:380px}
.searchbox .inp{padding-left:34px}
.searchbox .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9aa7bd;font-size:14px}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;gap:8px;font-size:13.5px;padding:3px 0}
.kv .k{color:var(--muted);width:86px;flex-shrink:0}
.attach-thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#f5f7fb}
.attach-file{display:inline-flex;align-items:center;gap:6px;background:#f4f6fb;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;max-width:190px}
.attach-file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner-warn{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid #f2ddb4;color:#8a5305;border-radius:12px;padding:11px 13px;font-size:13.5px}
.banner-bad{display:flex;gap:10px;align-items:flex-start;background:var(--bad-bg);border:1px solid #f3c6c4;color:#b91c1c;border-radius:12px;padding:11px 13px;font-size:13.5px}
.countdown{font-weight:800;font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.switch{position:relative;width:44px;height:25px;background:#d5dceb;border-radius:999px;border:none;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)}
.switch.on::after{left:22px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #eef1f7}
.set-row:last-child{border-bottom:none}
.set-row .ic{font-size:20px;width:32px;height:32px;background:#f2f5fb;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.footnote{font-size:12px;color:var(--muted);line-height:1.7}
.tag{display:inline-block;background:#eef1f7;border-radius:6px;padding:1px 7px;font-size:11.5px;color:#4c5a75;margin:2px 3px 2px 0}
.overlay-btns{display:flex;gap:8px;flex-wrap:wrap}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<header id="topbar" class="no-print">
  <div class="top-inner">
    <div class="brand" onclick="go('#/home')">
      <span class="logo">📋</span>
      <span>工作日志跟进系统<small>可实操版 v1.0</small></span>
    </div>
    <nav class="top-nav" id="topNav">
      <a href="#/home" data-nav="home">首页</a>
      <a href="#/tasks" data-nav="tasks">工作条</a>
      <a href="#/installments" data-nav="inst">分期计划</a>
      <a href="#/archive" data-nav="arch">归档</a>
      <a href="#/settings" data-nav="set">我的</a>
    </nav>
    <div class="top-act">
      <button class="btn btn-light btn-plus" onclick="quickOpen()">＋ 快速记录</button>
      <button class="icon-btn mobile-only" style="color:#fff;font-size:18px" onclick="quickOpen()" title="快速记录">＋</button>
    </div>
  </div>
</header>
<main id="app"></main>
<nav id="bottomNav" class="no-print">
  <a href="#/home" data-nav="home"><span class="ic">🏠</span>首页</a>
  <a href="#/tasks" data-nav="tasks"><span class="ic">📋</span>工作</a>
  <a href="#/installments" data-nav="inst"><span class="ic">💰</span>分期</a>
  <a href="#/archive" data-nav="arch"><span class="ic">🗂️</span>归档</a>
  <a href="#/settings" data-nav="set"><span class="ic">⚙️</span>我的</a>
</nav>
<button id="fab" class="no-print" onclick="quickOpen()">＋</button>
<div id="toastRoot"></div>
<div id="modalRoot"></div>
<input type="file" id="filePicker" multiple hidden accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv">
<script>
"use strict";
/* ================= 全局常量 ================= */
var STORE_KEY = "wlog_state_v1";
var STORE_VER = 1;
var W_STATUS = {
  active:{label:"进行中", cls:"active"},
  hold:{label:"已搁置", cls:"hold"},
  cancelled:{label:"已取消", cls:"cancelled"},
  done:{label:"已完成归档", cls:"done"}
};
var NODE_STATUS = {todo:{label:"未开始",cls:"gray"},doing:{label:"进行中",cls:"doing"},done:{label:"已完成",cls:"done"}};
var PRI = {high:{label:"高",cls:"high"},medium:{label:"中",cls:"medium"},low:{label:"低",cls:"low"}};
var INST_TYPE = {receivable:{label:"应收",cls:"receivable",ic:"📥"},payable:{label:"应付",cls:"payable",ic:"📤"}};
var PLAN_STATUS = {active:{label:"进行中",cls:"active"},settled:{label:"已结清",cls:"done"},cancelled:{label:"已取消",cls:"cancelled"}};
var DEF_CATS = ["客户跟进","订单与合同","车辆交付","返利对账","采购与库存","内部事务"];
var DAY_MS = 86400000;
var viewState = {status:"active",cat:"",q:""};

/* ================= 基础工具 ================= */
function esc(s){ if(s==null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function uid(p){ return (p||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7); }
function num(n){ n=Number(n); return isFinite(n)?n:0; }
function round2(n){ return Math.round((num(n)+Number.EPSILON)*100)/100; }
function fmtMoney(n){ n=round2(n); var neg=n<0; n=Math.abs(n); var s=n.toFixed(2); s=s.replace(/\B(?=(\d{3})+(?!\d))/g,","); return (neg?"-":"")+"¥"+s; }
function fmtMoneyNoSym(n){ return round2(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toYMD(d){ if(!(d instanceof Date)||isNaN(d)) return ""; var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function todayStr(){ return toYMD(new Date()); }
function addDaysStr(ymd,n){ var d=parseYMD(ymd); if(!d) return ""; d.setDate(d.getDate()+n); return toYMD(d); }
function parseYMD(s){ if(!s) return null; if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ var a=s.split("-"); var d=new Date(+a[0],+a[1]-1,+a[2]); return isNaN(d)?null:d; } return null; }
function fmtDate(s,withYear){ if(!s) return ""; var d=parseYMD(s); if(!d) return s; var wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]; var m=d.getMonth()+1,day=d.getDate(); var y = (withYear||d.getFullYear()!==new Date().getFullYear()) ? (d.getFullYear()+"年") : ""; return y+m+"月"+day+"日 "+wd; }
function fmtDT(ts){ if(!ts) return ""; var d=new Date(ts); if(isNaN(d)) return ""; var p=function(x){return String(x).padStart(2,"0")}; return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function daysFromToday(ymd){ if(!ymd) return null; var t=parseYMD(todayStr()).getTime(); var d=parseYMD(ymd); if(!d) return null; return Math.round((d.getTime()-t)/DAY_MS); }
function monthStep(ymd,n){ var d=parseYMD(ymd); if(!d) return ""; var day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return toYMD(d); }
function dateAtMonthDay(year,month,day){ var last=new Date(year,month,0).getDate(); return new Date(year,month-1,Math.min(day,last)); }
function weekdayLabel(ymd){ var d=parseYMD(ymd); return d?["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]:""; }
function nowISO(){ return new Date().toISOString(); }
function fileSizeText(b){ b=num(b); if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }

/* ================= 本地存储 ================= */
function defaultState(){
  return {ver:STORE_VER, categories:defCategories(), workItems:[], plans:[], users:[], requests:[], settings:{notify:false, onboard:true}, created:nowISO(), lastSync:""};
}
function defCategories(){
  return DEF_CATS.map(function(n,i){ return {id:"cat_"+i, name:n, sort:i, sys:true}; });
}
function loadState(){
  try{ var raw=localStorage.getItem(STORE_KEY); if(!raw) return null; var s=JSON.parse(raw); if(!s||!s.ver) return null; return s; }catch(e){ return null; }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ toast("保存失败：本地存储空间不足，请导出备份或删除部分附件","bad"); }
}
function wipeState(){ localStorage.removeItem(STORE_KEY); }
var state = loadState();
if(!state){ state = defaultState(); saveState(); }

/* ================= 分类 ================= */
function getCat(id){ for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; } return null; }
function catName(id){ var c=getCat(id); return c?c.name:"未分类"; }
function catCount(id){ return state.workItems.filter(function(w){return w.status==="active"&&w.categoryId===id;}).length; }

/* ================= 工作条工具 ================= */
function getWork(id){ for(var i=0;i<state.workItems.length;i++){ if(state.workItems[i].id===id) return state.workItems[i]; } return null; }
function activeItems(){ return state.workItems.filter(function(w){return w.status==="active";}); }
function workDueInfo(w){ var d=daysFromToday(w.deadline); if(w.deadline&&d!=null&&w.status==="active"){ if(d<0) return {lv:"overdue",txt:"已逾期 "+Math.abs(d)+" 天"}; if(d===0) return {lv:"today",txt:"今天到期"}; if(d<=3) return {lv:"hi",txt:"还有 "+d+" 天"}; if(d<=7) return {lv:"md",txt:"还有 "+d+" 天"}; if(d<=14) return {lv:"lo",txt:"还有 "+d+" 天"}; return {lv:"",txt:"还有 "+d+" 天"}; } return null; }
function workProgress(w){ var total=(w.nodes||[]).length; if(!total) return null; var done=w.nodes.filter(function(n){return n.status==="done";}).length; return {done:done,total:total,pct:Math.round(done/total*100)}; }
function isUnfinished(w){ return w.status==="active"; }
function sortWork(a,b){
  function rank(w){ var s=w.status==="active"?0:(w.status==="hold"?1:2); return s; }
  function dl(w){ return w.deadline||"9999-99-99"; }
  function pr(w){ var m={high:0,medium:1,low:2}; return m[w.priority]||1; }
  if(rank(a)!==rank(b)) return rank(a)-rank(b);
  if(dl(a)!==dl(b)) return dl(a)<dl(b)?-1:1;
  if(pr(a)!==pr(b)) return pr(a)-pr(b);
  return (b.updatedAt||0)-(a.updatedAt||0);
}

/* ================= 分期工具 ================= */
function getPlan(id){ for(var i=0;i<state.plans.length;i++){ if(state.plans[i].id===id) return state.plans[i]; } return null; }
function periodState(p,plan){ var amt=round2(p.amount), paid=round2(p.paidAmount||0); if(paid>=amt&&amt>0) return "paid"; if(paid>0) return "part"; var d=daysFromToday(p.dueDate); if(d!=null&&d<0) return "overdue"; return "wait"; }
function planPaidTotal(plan){ var s=0; (plan.periods||[]).forEach(function(p){ s=round2(s+round2(p.paidAmount||0)); }); return s; }
function planRemain(plan){ return round2(round2(plan.totalAmount)-planPaidTotal(plan)); }
function planProgress(plan){ if(!plan.periods||!plan.periods.length) return 0; var full=0; plan.periods.forEach(function(p){ full += round2(p.amount); }); return full>0?Math.min(100,Math.round(planPaidTotal(plan)/full*100)):0; }
function nextDuePeriod(plan){ var ps=(plan.periods||[]).filter(function(p){ return periodState(p,plan)!=="paid"; }); ps.sort(function(a,b){return (a.dueDate<b.dueDate?-1:1);}); return ps[0]||null; }
function planStatus(plan){ if(plan.cancelled) return "cancelled"; if(plan.periods&&plan.periods.length&&plan.periods.every(function(p){return periodState(p,plan)==="paid";})) return "settled"; return "active"; }
function periodDueInfo(p,plan){ var st=periodState(p,plan); if(st==="paid") return null; if(st==="part"){ return {lv:"part",txt:"部分已还"}; } var d=daysFromToday(p.dueDate); if(d==null) return null; if(d<0) return {lv:"overdue",txt:"已逾期 "+Math.abs(d)+" 天"}; if(d===0) return {lv:"hi",txt:"今天到期"}; if(d<=3) return {lv:"hi",txt:"还有 "+d+" 天"}; if(d<=7) return {lv:"md",txt:"还有 "+d+" 天"}; return {lv:"",txt:"还有 "+d+" 天"}; }
/* ================= 路由 ================= */
function go(h){ if(location.hash===h){ router(); } else { location.hash=h; } }
function markNav(){
  var h=location.hash||"#/home";
  var key="home";
  if(h.indexOf("#/tasks")===0||h.indexOf("#/task")===0) key="tasks";
  else if(h.indexOf("#/installment")===0) key="inst";
  else if(h.indexOf("#/archive")===0) key="arch";
  else if(h.indexOf("#/settings")===0||h.indexOf("#/categories")===0) key="set";
  document.querySelectorAll("[data-nav]").forEach(function(a){
    a.classList.toggle("on", a.getAttribute("data-nav")===key);
  });
  var top=document.getElementById("topNav"); if(top){}
}
function router(){
  var h=location.hash||"#/home";
  var m, html="";
  if(!curUser()){
    var tb=document.getElementById("topbar"), bn=document.getElementById("bottomNav"), fb=document.getElementById("fab");
    if(tb) tb.style.display="none"; if(bn) bn.style.display="none"; if(fb) fb.style.display="none";
    document.getElementById("app").innerHTML=vLogin();
    bindLogin(); markNav(); window.scrollTo(0,0);
    return;
  }
  var tb2=document.getElementById("topbar"), bn2=document.getElementById("bottomNav"), fb2=document.getElementById("fab");
  if(tb2) tb2.style.display=""; if(bn2) bn2.style.display=""; if(fb2) fb2.style.display="";
  if(h==="#/home"||h===""||h==="#/"){ html=vHome(); }
  else if((m=h.match(/^#\/tasks$/))||(m=h.match(/^#\/tasks\?/))){ html=vTasks(); }
  else if((m=h.match(/^#\/task\/new$/))){ html=vTaskNew(); }
  else if((m=h.match(/^#\/task\/([^\/]+)$/))){ var w=getWork(decodeURIComponent(m[1])); html=w?vTaskDetail(w):notFound(); }
  else if((m=h.match(/^#\/task\/([^\/]+)\/edit$/))){ var w2=getWork(decodeURIComponent(m[1])); html=w2?vTaskForm(w2):notFound(); }
  else if((m=h.match(/^#\/installments$/))){ html=vInstList(); }
  else if((m=h.match(/^#\/installment\/new$/))){ html=vInstForm(null); }
  else if((m=h.match(/^#\/installment\/([^\/]+)$/))){ var pl=getPlan(decodeURIComponent(m[1])); html=pl?vInstDetail(pl):notFound(); }
  else if((m=h.match(/^#\/installment\/([^\/]+)\/edit$/))){ var pl2=getPlan(decodeURIComponent(m[1])); html=pl2?vInstForm(pl2):notFound(); }
  else if((m=h.match(/^#\/archive$/))){ html=vArchive(); }
  else if((m=h.match(/^#\/categories$/))){ html=vCategories(); }
  else if((m=h.match(/^#\/users$/))){ html=vUsers(); }
  else if((m=h.match(/^#\/requests$/))){ html=vRequests(); }
  else if((m=h.match(/^#\/settings$/))){ html=vSettings(); }
  else { html=notFound(); }
  document.getElementById("app").innerHTML=html;
  document.getElementById("app").scrollTop=0; window.scrollTo(0,0);
  markNav();
}
function notFound(){ return '<div class="card empty"><div class="big">🧭</div><div class="t">页面不存在或已删除</div><div class="d">记录可能已被删除，回到首页看看</div><div class="mt14"><button class="btn pri" onclick="go(\'#/home\')">返回首页</button></div></div>'; }
function emptyBox(ic,t,d,btn){ return '<div class="card empty"><div class="big">'+ic+'</div><div class="t">'+esc(t)+'</div>'+(d?'<div class="d">'+esc(d)+'</div>':'')+(btn||"")+'</div>'; }

/* ================= 提醒汇总 ================= */
function reminderCollect(){
  var now=todayStr(), items=[];
  activeItems().forEach(function(w){
    if(!w.deadline) return;
    var info=workDueInfo(w); if(!info) return;
    if(["overdue","today","hi","md"].indexOf(info.lv)<0) return;
    items.push({kind:"work",w:w,info:info,dd:w.deadline,lv:info.lv,txt:info.txt});
  });
  state.plans.forEach(function(pl){
    if(planStatus(pl)!=="active") return;
    (pl.periods||[]).forEach(function(p){
      var info=periodDueInfo(p,pl); if(!info) return;
      if(["overdue","today","hi","md"].indexOf(info.lv)<0) return;
      items.push({kind:"inst",pl:pl,p:p,info:info,dd:p.dueDate,lv:info.lv,txt:info.txt});
    });
  });
  var rank={overdue:0,today:1,hi:2,md:3};
  items.sort(function(a,b){ return (rank[a.lv]!==rank[b.lv])?rank[a.lv]-rank[b.lv]:(a.dd<b.dd?-1:1); });
  return items;
}

/* ================= 首页 ================= */
/* 首页到期具体倒计时 */
function countdownText(ymd){
  var d=parseYMD(ymd); if(!d) return "";
  var end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59);
  var diff=end.getTime()-Date.now();
  var neg=diff<0, ms=Math.abs(diff);
  var days=Math.floor(ms/DAY_MS), hh=Math.floor((ms%DAY_MS)/3600000), mm=Math.floor((ms%3600000)/60000);
  var s;
  if(days>0){ s=days+" 天"+(hh>0?" "+hh+" 小时":""); }
  else if(hh>0){ s=hh+" 小时"+(mm>0?" "+mm+" 分钟":""); }
  else { s=Math.max(1,mm)+" 分钟"; }
  return (neg?"已逾期 ":"还剩 ")+s;
}
function updateCountdowns(){
  var els=document.querySelectorAll("[data-due]");
  for(var i=0;i<els.length;i++){ var v=els[i].getAttribute("data-due"); if(v) els[i].textContent=countdownText(v); }
}
function vHome(){
  var now=new Date(), wd=["日","一","二","三","四","五","六"][now.getDay()];
  var dateLine=now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 · 周"+wd;
  var acts=activeItems(), total=acts.length;
  var holds=state.workItems.filter(function(w){return w.status==="hold";}).length;
  var cancels=state.workItems.filter(function(w){return w.status==="cancelled";}).length;
  var done=state.workItems.filter(function(w){return w.status==="done";}).length;
  var pls=state.plans, actPlans=pls.filter(function(p){return planStatus(p)==="active";});
  var payDue=0, recDue=0;
  actPlans.forEach(function(pl){
    var next=nextDuePeriod(pl);
    if(next) { if(pl.type==="receivable") recDue++; else payDue++; }
  });
  var reminders=reminderCollect();
  var hiWarn=reminders.filter(function(r){return r.lv==="overdue"||r.lv==="today"||r.lv==="hi";});
  var normalWarn=reminders.filter(function(r){return r.lv==="md";});
  var todayItems=[], seenT={};
  acts.forEach(function(w){
    if((w.deadline&&daysFromToday(w.deadline)===0||w.today)&&!seenT[w.id]){ todayItems.push({kind:"work",w:w}); seenT[w.id]=1; }
  });
  actPlans.forEach(function(pl){(pl.periods||[]).forEach(function(p){ if(periodState(p,pl)!=="paid"&&p.dueDate&&daysFromToday(p.dueDate)===0) todayItems.push({kind:"inst",pl:pl,p:p}); });});

  var h="";
  h+='<div class="page-head"><div><h2>📋 我的工作台</h2><div class="sub">'+dateLine+'</div></div></div>';

  /* 高危横幅 */
  if(hiWarn.length){
    var hiTop=hiWarn.slice(0,3);
    h+='<div class="banner-bad mb12"><span style="font-size:18px">⛔</span><div class="grow"><b>高危提醒（'+hiWarn.length+' 项）</b>';
    hiTop.forEach(function(r){
      var label = r.kind==="work" ? esc(r.w.title) : (esc(r.pl.customerName)+" · 第"+(r.p.no)+"期");
      h+='<div style="margin-top:4px;font-size:13.5px"><a '+(r.kind==="work"?('href="#/task/'+encodeURIComponent(r.w.id)+'"'):('href="#/installment/'+encodeURIComponent(r.pl.id)+'"'))+' style="color:#b91c1c;font-weight:600">'+label+'</a> <span style="opacity:.9">— <span class="cd" data-due="'+esc(r.dd)+'">'+esc(countdownText(r.dd))+'</span>'+(r.kind==="inst"?" · "+fmtMoney(round2(r.p.amount)-round2(r.p.paidAmount||0)):"")+'</span></div>';
    });
    if(hiWarn.length>3) h+='<div style="font-size:12px;opacity:.8;margin-top:3px">…共 '+hiWarn.length+' 项</div>';
    h+='</div></div>';
  }
  if(normalWarn.length){
    var warnHtml="";
    normalWarn.slice(0,5).forEach(function(r){
      var nm2=(r.kind==="work"?esc(r.w.title):(esc(r.pl.customerName)+" 第"+r.p.no+"期"));
      warnHtml+='<span style="display:inline-block;margin-right:10px;white-space:nowrap">'+nm2+'（<span class="cd" data-due="'+esc(r.dd)+'">'+esc(countdownText(r.dd))+'</span>）</span>';
    });
    h+='<div class="banner-warn mb12"><span style="font-size:18px">⏰</span><div class="grow"><b>7天内到期（'+normalWarn.length+' 项）</b><div style="font-size:12.5px;opacity:.9;margin-top:2px;line-height:1.9">'+warnHtml+(normalWarn.length>5?'<span>…等 '+normalWarn.length+' 项</span>':"")+'</div></div></div>';
  }

  /* 统计卡片 */
  h+='<div class="stat-grid">';
  h+='<div class="stat blue" onclick="go(\'#/tasks\')"><div class="v">'+total+'</div><div class="l">未完成工作（进行中）</div><div class="l2">'+holds+' 条搁置 · '+cancels+' 条取消</div></div>';
  h+='<div class="stat green" onclick="go(\'#/archive\')"><div class="v">'+done+'</div><div class="l">已完成归档</div><div class="l2">点击查看历史</div></div>';
  h+='<div class="stat orange" onclick="go(\'#/installments\')"><div class="v">'+recDue+'</div><div class="l">待收款项（应收）</div><div class="l2">共 '+actPlans.filter(function(p){return p.type==="receivable";}).length+' 个进行中</div></div>';
  h+='<div class="stat" style="background:linear-gradient(135deg,#f3e8ff,#faf5ff)" onclick="go(\'#/installments\')"><div class="v">'+payDue+'</div><div class="l">待还款项（应付）</div><div class="l2">共 '+actPlans.filter(function(p){return p.type==="payable";}).length+' 个进行中</div></div>';
  h+='</div>';

  /* 分类统计 */
  var chips='';
  chips+='<span class="chip'+(viewState.cat===""?" on":"")+'" onclick="goTasks(\'\')">全部 <span class="n">'+total+'</span></span>';
  state.categories.forEach(function(c){
    var cnt=catCount(c.id);
    if(cnt>0) chips+='<span class="chip'+(viewState.cat===c.id?" on":"")+'" onclick="goTasks(\''+esc(c.id)+'\')">'+esc(c.name)+' <span class="n">'+cnt+'</span></span>';
  });
  h+='<div class="card"><div class="card-title">🗂️ 按分类查看</div><div class="pills">'+chips+'</div>';
  h+='<div class="row mt10 wrap" style="gap:8px">';
  h+='<button class="btn pri mini" onclick="quickOpen()">📝 快速记录一条工作</button>';
  h+='<button class="btn mini" onclick="go(\'#/task/new\')">＋ 完整新建工作条</button>';
  h+='<button class="btn mini" onclick="go(\'#/installment/new\')">💰 新建分期计划</button>';
  h+='</div></div>';

  /* 今日待办 */
  h+='<div class="section-t">📌 今日待办 <span class="sub">'+todayItems.length+' 项</span><span class="ln"></span></div>';
  if(!todayItems.length){ h+='<div class="card"><div class="empty" style="padding:18px"><div style="font-size:26px">✅</div><div style="margin-top:4px">今天暂无到期事项，可以安心推进其它工作</div></div></div>'; }
  else{
    h+='<div class="card" style="padding:6px 14px">';
    todayItems.slice(0,8).forEach(function(r){
      if(r.kind==="work"){ var w=r.w;
        h+='<div class="item" onclick="go(\'#/task/'+encodeURIComponent(w.id)+'\')"><div class="avatar" style="background:var(--ok-bg);color:var(--ok)">✓</div><div class="body"><div class="t small">'+esc(w.title)+'</div><div class="meta"><span class="badge active">'+esc(catName(w.categoryId))+'</span>'+(w.priority?'<span class="badge gray">'+PRI[w.priority].label+'优先级</span>':'')+(w.deadline?'<span>⏳ '+fmtDate(w.deadline)+'</span>':'')+'</div></div>'+(w.deadline?'<span class="cd" style="font-weight:700;color:var(--bad)">'+esc(countdownText(w.deadline))+'</span>':(w.today?'<span class="badge warn">📌 今日处理</span>':''))+'</div>';
      } else { var p=r.p,pl=r.pl;
        h+='<div class="item" onclick="go(\'#/installment/'+encodeURIComponent(pl.id)+'\')"><div class="avatar" style="background:var(--bad-bg);color:var(--bad)">¥</div><div class="body"><div class="t small">'+esc(pl.customerName)+' · 第'+p.no+'期 还款</div><div class="meta"><span class="badge '+(pl.type==="receivable"?"receivable":"payable")+'">'+INST_TYPE[pl.type].label+'</span><span class="money">'+fmtMoney(p.amount)+'</span></div></div><span class="cd" style="font-weight:700;color:var(--bad)">'+esc(countdownText(p.dueDate))+'</span></div>';
      }
    });
    if(todayItems.length>8) h+='<div class="center small muted" style="text-align:center;padding:8px">…还有 '+(todayItems.length-8)+' 项</div>';
    h+='</div>';
  }
  return h;
}
function goTasks(cat){ viewState.cat=cat||""; viewState.status="active"; viewState.q=""; go("#/tasks"); }
/* ================= 模态框 ================= */
function openModal(html){ document.getElementById("modalRoot").innerHTML='<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function confirmDlg(msg,cb){
  openModal('<div class="modal-head"><h3>⚠️ 请确认</h3><button class="icon-btn" onclick="closeModal()">✕</button></div><p style="font-size:14.5px;line-height:1.7;white-space:pre-wrap">'+esc(msg)+'</p><div class="row mt18" style="justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">再想想</button><button class="btn bad solid" id="cfmOk">确认</button></div>');

document.getElementById("filePicker").addEventListener("change",function(ev){
  var files=Array.prototype.slice.call(ev.target.files||[]);
  if(!files.length) return;
  var accepted=[];
  (function next(i){
    if(i>=files.length){ finishPick(accepted); return; }
    var f=files[i];
    if(f.size>15*1024*1024){ toast("单个文件超过 15MB，已跳过："+f.name,"bad"); next(i+1); return; }
    if(f.type&&f.type.indexOf("image")===0){ compressImage(f,function(dataUrl,size){ accepted.push({id:uid("a"),name:f.name,type:"image/jpeg",dataUrl:dataUrl,size:size}); next(i+1); },function(){ accepted.push(fileMeta(f)); next(i+1); }); }
    else if(f.size>3*1024*1024){ toast("非图片文件超过 3MB 无法本地保存，已跳过："+f.name,"bad"); next(i+1); return; }
    else { readAsDataURL(f,function(dataUrl){ accepted.push({id:uid("a"),name:f.name,type:f.type||"file",dataUrl:dataUrl,size:f.size}); next(i+1); }); }
  })(0);
});
function fileMeta(f){ return {id:uid("a"),name:f.name,type:f.type||"file",dataUrl:"",size:f.size}; }
function readAsDataURL(f,cb){ var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.readAsDataURL(f); }
function compressImage(f,cb,fallback){
  readAsDataURL(f,function(dataUrl){
    var img=new Image();
    img.onload=function(){
      var max=1280; var w=img.width,h=img.height;
      if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      var out=cv.toDataURL("image/jpeg",0.72);
      cb(out, Math.round(out.length*0.75));
    };
    img.onerror=function(){ fallback(); };
    img.src=dataUrl;
  });
}

var recog=null;
function startVoice(textEl,btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("当前浏览器不支持语音，请用电脑 Chrome/Edge 或手机 Chrome","bad"); return; }
  if(recog){ try{ recog.stop(); }catch(e){} recog=null; if(btn){ btn.classList.remove("on"); btn.textContent="🎤 语音输入"; btn.style.background=""; } return; }
  var rec=new SR();
  rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
  var finalText="";
  rec.onresult=function(ev){
    var interim="";
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i];
      if(r.isFinal){ finalText+=r[0].transcript; }
      else { interim+=r[0].transcript; }
    }
    var base=(textEl.dataset.origBase!=null?textEl.dataset.origBase:"")+finalText;
    textEl.value=base+(interim?"（"+interim+"）":"");
    textEl.scrollTop=textEl.scrollHeight;
  };
  rec.onend=function(){
    recog=null;
    if(btn){ btn.textContent="🎤 语音输入"; btn.style.background=""; }
    if(finalText) toast("语音已识别","ok");
    try{ textEl.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
  };
  rec.onerror=function(ev){ recog=null; if(btn) btn.textContent="🎤 语音输入"; if(ev.error==="not-allowed") toast("麦克风权限被拒绝","bad"); else if(ev.error!=="aborted") toast("语音识别出错："+ev.error,"bad"); };
  textEl.dataset.origBase=textEl.value;
  try{ rec.start(); recog=rec; if(btn){ btn.textContent="⏹ 录音中…点击停止"; btn.style.background="#fdeaea"; btn.style.color="#b91c1c"; } toast("开始录音，请说话…"); }catch(e){ toast("无法启动麦克风","bad"); }
}

/* ================= 本地智能整理 ================= */
var CN_NUM={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function smartParse(text){
  var o={title:"",deadline:"",customer:"",amounts:[],note:""};
  var t=String(text).replace(/\r\n/g,"\n").replace(/\n{2,}/g,"\n").trim();
  if(!t) return o;
  function custRe(){ return /(?:客户|联系人|对方|厂家|公司|老板|李总|张总|王总|刘总|赵总)(?:\s*[:：姓名是]\s*|\s+)?([\u4e00-\u9fa5A-Za-z0-9]{2,12}(?:公司|物流|集团|有限|运输|汽贸|厂|店|商贸|贸易))/g; }
  var amountRe=/([0-9][0-9,，]*(?:\.\d+)?)\s*(万元?|w|W|块钱?|元|rmb)/g;
  var mm;
  while((mm=amountRe.exec(t))){ var v=parseFloat(mm[1].replace(/[，,]/g,"")); var suf=(mm[2]||""); if(suf.charAt(0)==="万"||suf.charAt(0)==="w"||suf.charAt(0)==="W") v*=10000; o.amounts.push(round2(v)); }
  var cm=custRe().exec(t);
  if(cm) o.customer=cm[1];
  var year=new Date().getFullYear();
  function setYMD(y,m,d){ return toYMD(new Date(y,m-1,d)); }
  var m1=t.match(/(\d{4})[年/-](\d{1,2})[月/-](\d{1,2})日?/);
  if(m1){ o.deadline=setYMD(+m1[1],+m1[2],+m1[3]); }
  else{
    var m2=t.match(/(\d{1,2})月(\d{1,2})[日号]/);
    if(m2){ var cand=new Date(year,+m2[1]-1,+m2[2]); var today0=new Date(); today0.setHours(0,0,0,0); if(cand<today0) cand.setFullYear(year+1); o.deadline=toYMD(cand); }
    else{
      var today=new Date(); today.setHours(0,0,0,0);
      if(/大后天/.test(t)) o.deadline=toYMD(new Date(today.getTime()+3*DAY_MS));
      else if(/后天/.test(t)) o.deadline=toYMD(new Date(today.getTime()+2*DAY_MS));
      else if(/明天/.test(t)) o.deadline=toYMD(new Date(today.getTime()+DAY_MS));
      else if(/今天|今日/.test(t)) o.deadline=toYMD(today);
      else{
        var mr=t.match(/(\d+)\s*天(?:之)?后/);
        if(mr) o.deadline=toYMD(new Date(today.getTime()+(+mr[1])*DAY_MS));
        else{
          var wm=t.match(/(?:下|本|这)周([一二三四五六日天])/);
          if(wm){ var map={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0}; var want=map[wm[1]]; var d=new Date(today); var diff=want-d.getDay(); if(diff<=0) diff+=7; if(/下周/.test(t)) diff+=7; d.setDate(d.getDate()+diff); o.deadline=toYMD(d); }
        }
      }
    }
  }
  /* 标题：按行清洗，去掉日期/客户/金额及残留字段名，取第一个有意义的短句 */
  var datePh=/(?:在|于)?(?:\d{4}[年/-]\d{1,2}[月/-]\d{1,2}日?|\d{1,2}月\d{1,2}[日号]|今天|今日|明天|后天|大后天|(?:下|本|这)周[一二三四五六日天])(?:之前|以前|之?前|以内|之内|内|到|左右|当天)?/g;
  var remain=t.replace(datePh," ").replace(custRe()," ").replace(amountRe," ");
  remain=remain.replace(/[。！？!?]\s*.*$/," ");
  var junkLine=/^(?:金额|费用|货款|尾款|定金|欠款|合计|共|备注|客户|联系人|厂家|公司|编号|单号|内容|说明|时间|地点)[:：]?$/;
  var clean="";
  var lines=remain.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
  outer:
  for(var li=0;li<lines.length;li++){
    var segs=lines[li].split(/[，,。:：;；]/).map(function(x){return x.trim();}).filter(function(x){return x.length>=2;});
    for(var sj=0;sj<segs.length;sj++){
      var cand=segs[sj].replace(/^(?:需|请|要|记得|别忘(?:了|记)?|务必|尽快|找时间)/,"").replace(/[，,。:：;；]+$/,"").trim();
      if(cand&&!junkLine.test(cand)&&!junkLine.test(segs[sj])){ clean=cand; break outer; }
    }
  }
  if(!clean||clean.length<2) clean=t;
  o.title=clean.slice(0,40);
  return o;
}

  h+='<form onsubmit="markPaidSubmit(event,\''+planId+'\','+no+')">';
  h+='<div class="field"><label>本次还款/到账金额</label><input class="inp" type="number" step="0.01" min="0.01" max="'+remain+'" id="mpAmt" required value="'+remain+'"></div>';

  e.preventDefault();

function ruleAutoText(){
  var f=document.getElementById("iFreq"); if(!f) return "";
  var map={month_same:"每月一期（按首期日同期还款）",month_last:"每月最后一天还款",quarter:"每季度一期（每3个月，按首期日）",days:"每"+ (document.getElementById("iDaysN")?document.getElementById("iDaysN").value:30) +"天一期"};
  return map[f.value]||"";

function genFixedPeriods(total,count,start,freq,freqN){
  var out=[];
  if(!total||!count||!start) return out;
  var tc=Math.round(total*100);
  var per=Math.floor(tc/count);
  var last=tc-per*(count-1);
  var prev=start;
  for(var i=0;i<count;i++){
    var amt=(i===count-1)?last:per;
    out.push({no:i+1,amount:round2(amt/100),dueDate:prev,paidAmount:0,paidDate:"",note:(i===count-1&&count>1?"含尾差调整":""),locked:false});
    if(i<count-1){
      if(freq==="month_last"){ var d=parseYMD(prev); if(d){ d.setDate(1); d.setMonth(d.getMonth()+1); var lastD=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(lastD); prev=toYMD(d); } }
      else if(freq==="quarter"){ prev=monthStep(prev,3); }
      else if(freq==="days"){ prev=addDaysStr(prev,freqN||30); }
      else { prev=monthStep(prev,1); }
    }
  }
  return out;
}
function refreshFixedPrev(){
  var total=num((document.getElementById("iTotal")||{value:0}).value);
  var count=num((document.getElementById("iCount")||{value:0}).value)||0;
  var start=(document.getElementById("iStart")||{value:""}).value;
  var freq=(document.getElementById("iFreq")||{value:"month_same"}).value;
  var freqN=num((document.getElementById("iDaysN")||{value:30}).value)||30;
  var box=document.getElementById("fixedPrev"); if(!box) return;
  if(!total||!count||!start){ box.innerHTML='<div class="small muted">填写总金额、期数、首期日期后，自动预览每期明细；每期金额与日期都可单独修改。</div>'; return; }
  var ps=genFixedPeriods(total,count,start,freq,freqN);
  if(!ps.length){ box.innerHTML=""; return; }
  var h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>期次</th><th class="num">应还金额（元，可改）</th><th>到期日（可改）</th></tr></thead><tbody>';
  ps.forEach(function(p){
    h+='<tr><td>第 '+p.no+' 期</td>'
      +'<td class="num"><input class="inp sm fpd-amt" type="number" step="0.01" min="0.01" value="'+p.amount+'" style="width:122px;text-align:right"></td>'
      +'<td><input class="inp sm fpd-date" type="date" value="'+p.dueDate+'"'+(p.note?' title="'+esc(p.note)+'"':'')+'></td></tr>';
  });
  h+='</tbody></table></div><div class="form-hint mt6">合计 '+fmtMoney(round2(total))+' · 共 '+count+' 期 · 如需某期（如末期提前结清日）不同，直接改对应金额/日期即可</div>';

      var existing=noAttr?byNo[noAttr]:null;

        if(round2(existing.paidAmount||0)<=0||round2(existing.paidAmount)<round2(existing.amount)){
          existing.amount=amt; existing.dueDate=due; existing.note=r.querySelector(".fNote").value.trim();
        }
        newPs.push(existing);
      } else {
        nextNo++;
        newPs.push({no:nextNo,amount:amt,dueDate:due,note:r.querySelector(".fNote").value.trim(),paidAmount:0,paidDate:""});
      }
    });
    if(err){ toast(err,"bad"); return; }
    pl.periods=newPs.sort(function(a,b){return a.no-b.no;});
    pl.periodCount=newPs.length;
    pl.totalAmount=round2(sum);
    pl.repaymentRule=document.getElementById("iRule").value.trim()||"灵活分期，逐期约定";
    pl.startDate=pl.periods.length?pl.periods[0].dueDate:"";
  }
  saveState();
  if(isNew&&typeof instNewFiles!=="undefined"&&instNewFiles.length){
    var stTxt=document.getElementById("instStatus"); if(stTxt) stTxt.textContent="⏳ 正在压缩/保存附件…";
    var atts2=await filesToAttachments(instNewFiles);
    pl.attachments=(pl.attachments||[]).concat(atts2);
    saveState();
  }
  if(isNew){ instNewFiles=[]; revokeUrls(instObjUrls); instObjUrls=[]; }
  toast(isNew?"分期计划已创建 ✓":"已保存","ok");
  go("#/installment/"+encodeURIComponent(pl.id));
}

function catSave(e,id){
  e.preventDefault();
  var name=document.getElementById("cName").value.trim();
  if(!name){ toast("请输入名称","bad"); return; }
  if(state.categories.some(function(c){return c.id!==id&&c.name===name;})){ toast("已有同名分类","bad"); return; }
  if(id){ var c=getCat(id); c.name=name; }
  else { var max=0; state.categories.forEach(function(c){ if(c.sort>max)max=c.sort; }); state.categories.push({id:uid("cat"),name:name,sort:max+1,sys:false}); }
  saveState(); closeModal(); toast("已保存","ok"); router();
}
function moveCat(id,dir){
  var arr=state.categories.slice().sort(function(a,b){return a.sort-b.sort;});
  var i=arr.findIndex(function(c){return c.id===id;}); if(i<0) return;
  var j=i+dir; if(j<0||j>=arr.length) return;
  var t=arr[i].sort; arr[i].sort=arr[j].sort; arr[j].sort=t;
  saveState(); router();
}
function askDelCat(id){
  var c=getCat(id); if(!c) return;
  var used=state.workItems.filter(function(w){return w.categoryId===id;}).length;
  if(used>0){ toast("该分类下有 "+used+" 条工作，无法删除（可先改到其它分类）","bad"); return; }
  if(state.categories.length<=1){ toast("至少保留一个分类","bad"); return; }

function triggerDownload(name,blob){
  var a=document.createElement("a");

function fileExt(name){ var i=String(name).lastIndexOf("."); return i<0?"":String(name).slice(i+1).toLowerCase(); }
function isProbablyText(s){ var sample=String(s).slice(0,4000); var bad=0; for(var i=0;i<sample.length;i++){ var c=sample.charCodeAt(i); if(c===0||(c>0&&c<9)||(c>13&&c<32)) bad++; } return bad<Math.max(1,sample.length)*0.02; }

function zipEntries(u8){
  var out=[],i=0;
  while(i+30<=u8.length){
    var sig=(u8[i]|(u8[i+1]<<8)|(u8[i+2]<<16)|(u8[i+3]<<24))>>>0;
    if(sig!==0x04034b50) break;
    var method=u8[i+8]|(u8[i+9]<<8);
    var comp=(u8[i+18]|(u8[i+19]<<8)|(u8[i+20]<<16)|(u8[i+21]<<24))>>>0;
    var nlen=u8[i+26]|(u8[i+27]<<8);
    var elen=u8[i+28]|(u8[i+29]<<8);
    var start=i+30;
    var bytes=u8.subarray(start,start+nlen);
    var name=""; for(var k=0;k<bytes.length;k++) name+=String.fromCharCode(bytes[k]);
    out.push({name:name,method:method,size:comp,off:start+nlen+elen});

function inflateRaw(u8){
  if(typeof DecompressionStream==="undefined") return Promise.reject(new Error("no-inflate"));

async function extractDocx(file){
  var buf=await file.arrayBuffer();
  var entries=zipEntries(new Uint8Array(buf));
  var doc=null; entries.forEach(function(e){ if(e.name==="word/document.xml") doc=e; });
  if(!doc) return {ok:false,reason:"nodoc"};
  var raw;
  if(doc.method===0) raw=new Uint8Array(buf,doc.off,doc.size);
  else if(doc.method===8) raw=new Uint8Array(await inflateRaw(new Uint8Array(buf,doc.off,doc.size)));
  else return {ok:false,reason:"compressed"};
  var xml=new TextDecoder("utf-8").decode(raw);
  xml=xml.replace(/<w:p[^>]*>/g,"\n").replace(/<w:br[^>]*\/>/g,"\n").replace(/<w:tab[^>]*\/>/g,"\t");
  xml=xml.replace(/<[^>]+>/g,"");
  var text=decodeXmlEntities(xml).replace(/[ \t]+/g," ").split(/\n+/).map(function(x){return x.trim();}).filter(Boolean).join("\n");
  if(!text.trim()) return {ok:false,reason:"empty"};
  return {ok:true,text:text};
}
async function extractFileText(file){
  var ext=fileExt(file.name);
  try{
    if((file.type&&file.type.indexOf("text/")===0)||["txt","md","csv","tsv","json","log","ini","srt","vtt","xml"].indexOf(ext)>=0){
      var t=await file.text();
      if(t&&isProbablyText(t)) return {ok:true,text:t,source:file.name};
      return {ok:false,reason:"binary",source:file.name};
    }
    if(file.type&&file.type.indexOf("image/")===0) return {ok:false,kind:"image",source:file.name};
    if(ext==="docx"){ var r=await extractDocx(file); r.source=file.name; return r; }
    if(ext==="pdf"){ try{ var pr=await extractPdfText(file); pr.source=file.name; return pr; }catch(e){ return {ok:false,reason:"error",source:file.name}; } }
    if(ext==="html"||ext==="htm"){ var s=await file.text(); return {ok:true,text:stripHtml(s),source:file.name}; }
    return {ok:false,reason:"unsupported",source:file.name};
  }catch(e){ return {ok:false,reason:"error",source:file.name}; }
}
function fileToDataUrl(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; r.readAsDataURL(f); }); }

function suggestNodes(text){
  var out=[];
  if(!text) return out;
  var lines=String(text).split(/\r?\n/);
  lines.forEach(function(ln){
    var m=ln.trim().match(/^(?:[（(]?\d+[）).、．:]|[-*•]|(?:①②③④⑤⑥⑦⑧⑨⑩))\s*(.{2,60})$/);

function normAmt(numStr,unit){ var v=parseFloat(String(numStr).replace(/[，,]/g,"")); if(!isFinite(v)) v=0; if(unit&&(unit.charAt(0)==="万"||unit.charAt(0)==="w"||unit.charAt(0)==="W")) v*=10000; return round2(v); }
function smartParseInst(text){
  var o={customer:"",type:"receivable",total:0,count:0,per:0,startDate:"",rule:"",mode:"fixed",contact:""};
  var t=String(text).replace(/\r\n/g,"\n").trim();
  if(!t) return o;
  var base=smartParse(t);
  o.customer=base.customer||"";
  if(!o.customer){ var nm=t.match(/(?:客户|收款人|付款人|贷款人|联系人|单位|公司)\s*[:：]\s*([\u4e00-\u9fa5A-Za-z0-9·]{2,20})/); if(nm) o.customer=nm[1]; }
  o.startDate=base.deadline||"";
  var s=t;
  var payK=/应付|我们?欠|欠(?:银行|厂家|别人)|付给|按揭|月供|融资|贷款|还款给|需要?还款|该还款/;
  var recK=/应收|客户欠|欠我们|分期付款|客户分期|收(?:车款|货款|回)|到账/;

  var pm=s.match(/(?:每期|月供|每月还|每期还|每期支付|月还款|每期应还)\s*[:：]?\s*([0-9][0-9,，]*(?:\.\d+)?)\s*(万元?|w|W|块钱?|元|rmb)/);

  var tm=s.match(/(?:总金额|总额|合计|总价|车款|货款|本金|借款额|欠款额)\s*[:：]?\s*([0-9][0-9,，]*(?:\.\d+)?)\s*(万元?|w|W|块钱?|元|rmb)/);

  if(!o.total&&base.amounts.length) o.total=base.amounts[0];
  if(o.count>0&&o.per>0&&!tm) o.total=round2(o.per*o.count);
  if(o.total<=0&&o.count>0&&o.per>0) o.total=round2(o.per*o.count);

  if(fm) o.contact=fm[0];
  if(/灵活|金额不固定|每次不一|按约定/.test(s)) o.mode="flexible";
  return o;
}

function pdfReadStream(obj){

function hexClean(s){ return String(s).replace(/\s+/g,""); }
function utf16FromHex(hex){

}
function parseCmap(text){

    for(var li=0;li<lens.length;li++){ var L=lens[li]; if(i+L<=bytes.length){ var h=bytesHex(bytes,i,L).toLowerCase(); if(map[h]){ hit=map[h]; used=L; break; } } }

function extractFontMap(raw,objs){

function pdfTokenize(s){

        if(ch==='\\'){ var nx=s.charAt(k+1);
          if(nx==='n'){out+='\n';k+=2;continue;} if(nx==='r'){out+='\r';k+=2;continue;} if(nx==='t'){out+='\t';k+=2;continue;} if(nx==='b'){out+='\b';k+=2;continue;} if(nx==='f'){out+='\f';k+=2;continue;} if(nx==='('||nx===')'||nx==='\\'){out+=nx;k+=2;continue;}

      toks.push({t:'str',bytes:bytes}); i=k; continue;
    }
    if(c==='<'){

    }

    var w="";

    if(w){ toks.push({t:'kw',v:w}); }

async function extractPdfText(file){
  var u8=new Uint8Array(await file.arrayBuffer());

  for(var n in objs){
    var tu=dictGetRef(objs[n].raw,"ToUnicode");

  }

function pdfStreamText(obj){ return pdfReadStream(obj).then(function(u){ if(!u) return null; try{ return new TextDecoder("utf-8").decode(u); }catch(e){ return null; } }); }
function renderPdfText(toks,fontMap,fontCmap){

    var t=toks[i];
    if(t.t==='name'){
      if(i+2<toks.length&&toks[i+1]&&toks[i+1].t==='num'&&toks[i+2]&&toks[i+2].t==='kw'&&toks[i+2].v==='Tf'){ curFont=t.v; i+=2; }

/* ---- PDF 期次表识别与自动填入 ---- */
function detectPdfSchedule(text,fname){
  var res={ok:false,rows:[],customer:"",type:"receivable",total:0};
  var s=String(text||"");
  var cm=s.match(/(?:致|承租人|客户|单位名称)\s*[:：]?\s*([\u4e00-\u9fa5A-Za-z0-9·]{2,20})/);
  if(cm) res.customer=cm[1];
  if(!res.customer&&fname){ var fm=String(fname).match(/([\u4e00-\u9fa5]{2,4})(?=\s*(?:还款|支付|融资|租赁|起租|回租))/); if(fm) res.customer=fm[1]; }
  var recK2=/应收|客户欠|欠我们|客户分?期付/;
  var payK2=/应付|按揭|月供|支付给|还款给|需支付/;
  var leaseish=/(租金|租赁|融资|起租|还款支付表|还款表|回租)/.test(s+String(fname||""));
  if(payK2.test(s)&&!recK2.test(s)) res.type="payable";
  else if(recK2.test(s)) res.type="receivable";
  /* 类型在期次解析后再最终判定（下方） */
  var tm=s.match(/(?:租金总额|总金额|总额|合计|本金)\s*[:：]?\s*(?:RMB\s*)?([\d,]+(?:\.\d+)?)/);
  var lines=String(s).split(/\r?\n/), seen={}, lastNo=0;
  lines.forEach(function(ln){
    var m=ln.match(/^\s*(\d{1,3})\s+(\d{4})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})\s+([\d][\d,]*(?:\.\d+)?)/);
    if(m){
      var no=+m[1], date=m[2]+"-"+String(+m[3]).padStart(2,"0")+"-"+String(+m[4]).padStart(2,"0");
      var dt=parseYMD(date);
      if(dt&&no>lastNo&&!seen[no]){ seen[no]=1; lastNo=no; res.rows.push({no:no,date:date,amt:round2(parseFloat(m[5].replace(/[\s,]/g,"")))}); }
    }
  });
  if(res.rows.length>=2){
    res.ok=true;
    var sum=0; res.rows.forEach(function(r){ sum=round2(sum+r.amt); });
    res.total=sum||(tm?round2(parseFloat(tm[1].replace(/,/g,""))):0);
    var dayMap={}; res.rows.forEach(function(r){ var d=parseYMD(r.date); if(d) dayMap[d.getDate()]=(dayMap[d.getDate()]||0)+1; });
    var best=0,bk=0; for(var k in dayMap){ if(dayMap[k]>best){ best=dayMap[k]; bk=+k; } }
    res.day=bk;
    if(!recK2.test(s)&&(payK2.test(s)||leaseish)) res.type="payable";
  }
  return res;
}function applyPdfSchedule(sc){
  var nameEl=document.getElementById("iName");
  if(nameEl&&sc.customer&&!nameEl.value) nameEl.value=sc.customer;
  setIType(sc.type);

  var cEl=document.getElementById("iCount");
  if(cEl&&sc.rows.length) cEl.value=sc.rows.length;
  var sEl=document.getElementById("iStart");
  if(sEl&&sc.rows.length) sEl.value=sc.rows[0].date;
  if(formMode!=="fixed") setIMode("fixed");
  var ruleEl=document.getElementById("iRule");
  if(ruleEl){
    if(sc.day) ruleEl.value="每月"+sc.day+"日还款（按附表"+sc.rows.length+"期）";
    else ruleEl.value="按附表逐期还款（"+sc.rows.length+"期）";
  }
  refreshFixedPrev();
  var trs=document.querySelectorAll("#fixedPrev tbody tr");
  if(trs.length===sc.rows.length){
    Array.prototype.forEach.call(trs,function(tr,i){
      var amtI=tr.querySelector(".fpd-amt"); if(amtI) amtI.value=sc.rows[i].amt;

async function shaHex(text){ try{ var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(text))); return Array.prototype.map.call(new Uint8Array(buf),function(b){ return (b<16?"0":"")+b.toString(16); }).join(""); }catch(e){ var h=0,salt="wlog"; var x=(salt+text); for(var i=0;i<x.length;i++){ h=(h<<5)-h+x.charCodeAt(i); h|=0; } return "x"+(h>>>0).toString(16); } }

function csvEsc(v){ v=(v==null?"":String(v)); if(/[",\r\n]/.test(v)){ return '"'+v.replace(/"/g,'""')+'"'; } return v; }
function exportCsvFile(name,rows){
  var lines=rows.map(function(r){ return r.map(csvEsc).join(","); });
  var blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  triggerDownload(name,blob); toast("已导出表格文件： "+name,"ok");
}
function parseCsv(text){
  var rows=[], row=[], cur="", q=false; text=String(text||"");
  for(var i=0;i<text.length;i++){
    var c=text.charAt(i);
    if(q){
      if(c==='"'){ if(text.charAt(i+1)==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==="\r"){ /* skip */ }
      else cur+=c;
    }
  }
  if(cur.length>0||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

  var t=String(text||"");
  var marks=[],m;
  var rePay=/付款(?:账户|户名|公司|方|账户名|名称)/g; while((m=rePay.exec(t))) marks.push({pos:m.index,dir:"payer"});
  var reRec=/收款(?:账户|户名|公司|方|账户名|名称)/g; while((m=reRec.exec(t))) marks.push({pos:m.index,dir:"payee"});
  var reBank=/银行户名/g; while((m=reBank.exec(t))) marks.push({pos:m.index,dir:"payee",bank:true});
  marks.sort(function(a,b){return a.pos-b.pos;});
  function blockOf(pos,next){
    var seg=t.slice(pos, next>0?next:pos+280).slice(0,320);
    var s1=seg.match(/户名|账号|公司|名称/); if(!s1) return "";
    return seg;
  }
  for(var i=0;i<marks.length;i++){
    var mk=marks[i];
    var nxt=marks[i+1]?marks[i+1].pos:-1;
    var blk=t.slice(mk.pos, nxt>0?nxt:mk.pos+280).slice(0,320);
    var key=mk.dir==="payer"?"付款":"收款";
    var nmRe=new RegExp("(?:银行户名|"+key+"户名|"+key+"公司|"+key+"方(?:名称)?|"+key+"账户名|公司名称|户名)\\s*[:：]?\\s*([\\u4e00-\\u9fa5A-Za-z0-9·（）()]+)");
    var nm=(blk.match(nmRe)||[])[1]||"";
    var no=(blk.match(/(?:银行)?账号\s*[:：]?\s*([0-9]{6,})/)||[])[1]||"";
    if(mk.dir==="payer"){ if(nm&&!out.payerName) out.payerName=nm.trim(); if(no&&!out.payerNo) out.payerNo=no; }
    else { if(nm&&!out.payeeName) out.payeeName=nm.trim(); if(no&&!out.payeeNo) out.payeeNo=no; }
  }
  if(!out.payeeNo){ var long=t.match(/\b([0-9]{12,})\b/); if(long) out.payeeNo=long[1]; }
  if(!out.payeeName&&!out.payerName){ var single=splitAcctStr(t); if(single.name&&!out.payeeName) out.payeeName=single.name; }
  return out;
}
function extractPlanMetaFromText(text,fname){
  var r={planNo:"",payerName:"",payerNo:"",payeeName:"",payeeNo:""};
  var src=String(fname||"")+"\n"+String(text||"");
  var t=String(text||"").replace(/\r?\n/g," ").replace(/ ?- ?/g,"-").replace(/\s+/g," ");
  var cm=t.match(/(?:租赁合同编号|合同编号|合同号|编号)\s*[:：]?\s*([A-Za-z0-9][A-Za-z0-9\-_\/]*)/);
  if(cm&&cm[1]) r.planNo=cm[1];
  if(!r.planNo){
    var m1=(t+" "+src).match(/20\d{2}[A-Za-z]{2,}[A-Z0-9a-z\-]+/);
    if(m1){ r.planNo=m1[0]; }
    else {
      var cands=(t+" "+src).match(/[A-Za-z]{1,6}[0-9]{2,}[A-Za-z0-9\-]*|\d{4,}[A-Za-z][A-Z0-9a-z\-]*/g)||[];
      cands=cands.filter(function(s){ return s.replace(/-/g,"").length>=10; });
      if(cands.length) r.planNo=cands[0];
    }
  }
  var ap=acctParser(String(text||""));
  r.payerName=ap.payerName; r.payerNo=ap.payerNo; r.payeeName=ap.payeeName; r.payeeNo=ap.payeeNo;
  return r;
}

    if(pl.payerAccount!=null||pl.payeeAccount!=null){ delete pl.payerAccount; delete pl.payeeAccount; }

function fileFromDataUrl(att){
  try{
    var m=/^data:([^;]+);base64,(.*)$/.exec(att&&att.dataUrl||"");
    if(!m) return Promise.resolve(null);
    var bin=atob(m[2]); var u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    return Promise.resolve(new File([u8],att.name||"附件",{type:m[1]}));
  }catch(e){ return Promise.resolve(null); }
}
async function fillOnePlan(pid,quiet){
  var pl=getPlan(pid); if(!pl) return {no:0,payeeName:0,payeeNo:0,payerName:0,payerNo:0};
  var texts=[];
  if(pl.note) texts.push(pl.note); if(pl.repaymentRule) texts.push(pl.repaymentRule); if(pl.customerContact) texts.push(pl.customerContact);
  var atts=pl.attachments||[];
  for(var i=0;i<atts.length;i++){
    try{ var f=await fileFromDataUrl(atts[i]); if(!f) continue; var r=await extractFileText(f); if(r&&r.ok) texts.push(r.text); }catch(e){}
  }
  var meta=extractPlanMetaFromText(texts.join("\n"),pl.customerName||"");
  var changed=false;
  if(meta.planNo&&!pl.planNo){ pl.planNo=meta.planNo; changed=true; }
  if(meta.payerName&&!pl.payerAcctName){ pl.payerAcctName=meta.payerName; changed=true; }
  if(meta.payerNo&&!pl.payerAcctNo){ pl.payerAcctNo=meta.payerNo; changed=true; }
  if(meta.payeeName&&!pl.payeeAcctName){ pl.payeeAcctName=meta.payeeName; changed=true; }
  if(meta.payeeNo&&!pl.payeeAcctNo){ pl.payeeAcctNo=meta.payeeNo; changed=true; }
  if(changed){ pl.updatedAt=Date.now(); saveState(); }
  if(!quiet&&changed) toast("已识别补齐：「"+(pl.customerName||"")+"」"+(pl.planNo?" 编号 "+pl.planNo:"")+(pl.payeeAcctName?" 收款户名 "+pl.payeeAcctName:"")+(pl.payeeAcctNo?" 收款账号 "+pl.payeeAcctNo:"")+"","ok");
  return {no:meta.planNo&&pl.planNo?1:0,payeeName:pl.payeeAcctName?1:0,payeeNo:pl.payeeAcctNo?1:0,payerName:pl.payerAcctName?1:0,payerNo:pl.payerAcctNo?1:0};
}

/* ================= 图片 OCR（自动转文字，需联网加载引擎） ================= */
function ocrEnabled(){ return !(state.settings&&state.settings.ocrEnabled===false); }
function ocrLang(){ var v=(state.settings&&state.settings.ocrLang)||"chi_sim"; return v; }
function ocrLangSelVal(){ return (state.settings&&state.settings.ocrLang)||"chi_sim"; }

var _tessPromise=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessPromise) return _tessPromise;
  _tessPromise=new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js";
    s.onload=function(){ if(window.Tesseract){ res(window.Tesseract); } else { _tessPromise=null; rej(new Error("OCR 引擎加载失败")); } };
    s.onerror=function(){ _tessPromise=null; rej(new Error("无法联网加载 OCR 引擎")); };
    document.head.appendChild(s);
  });
  return _tessPromise;
}
async function ocrImageFile(file,onProg){
  var T=await loadTesseract();
  var res=await T.recognize(file,ocrLang(),{logger:function(m){ if(onProg&&m.status==="recognizing text") onProg(m.progress); }});
  return (res&&res.data&&res.data.text)?res.data.text:"";
}
async function tryOcrAppend(f,taEl,statusEl){
  if(!statusEl) return {changed:false,name:""};
  statusEl.textContent="⏳ 正在识别图片文字："+f.name+"（首次需联网加载引擎，约10-40秒）…";
  try{
    var txt=await ocrImageFile(f);
    if(txt&&txt.trim()){
      var cur=taEl.value.trim();
      taEl.value=cur?(cur+"\n"+txt.trim()):txt.trim();
      statusEl.textContent="✅ 图片 OCR 完成："+f.name;
      return {changed:true,name:f.name+"（OCR）"};
    }
    statusEl.textContent="图片识别无文字："+f.name+"（已作为附件保留）";
  }catch(e){
    statusEl.textContent="图片文字识别不可用（需联网加载引擎）："+f.name;
  }
  return {changed:false,name:""};
}

function fmtNodeAt(at){ if(!at) return ""; var d=new Date(at); if(isNaN(d)) return at; var p=function(x){return String(x).padStart(2,"0")}; var wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]; return (d.getMonth()+1)+"月"+d.getDate()+"日 "+wd+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function fmtNodeShort(at){ if(!at) return ""; var d=new Date(at); if(isNaN(d)) return at; var p=function(x){return String(x).padStart(2,"0")}; return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }

/* ================= 在线更新 ================= */
var APP_VERSION="2.1.1";
var APP_BUILD="2026-09-30";
var UPDATE_MANIFEST_URL="https://wang66676.github.io/work-log-tracker/update.json";
function cmpVer(a,b){ var x=String(a).split("."), y=String(b).split("."); for(var i=0;i<3;i++){ var n=parseInt(x[i]||"0",10)||0, m=parseInt(y[i]||"0",10)||0; if(n>m) return 1; if(n<m) return -1; } return 0; }
function checkUpdate(manual){
  var url=UPDATE_MANIFEST_URL+"?t="+Date.now();
  fetch(url,{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    try{ state.settings=state.settings||{}; state.settings.lastUpdateCheck=todayStr(); saveState(); }catch(e){}

      h+='<div class="footnote mb10" style="color:#0f7a57">✅ 更新不会删除已录入数据（请直接覆盖安装，不要先卸载）；为稳妥建议先点下面「先备份再更新」。</div>';
      if(notes) h+='<div class="footnote mb12" style="line-height:1.8">'+notes+'</div>';

      if(d.setup) h+='<a class="btn" href="'+esc(d.setup)+'" target="_blank" rel="noopener" onclick="closeModal()">⬇️ 下载电脑版</a>';

      h+='<button class="btn ghost" onclick="reloadForUpdate()">🔄 更新网页版</button></div>';
      openModal(h);
    } else if(manual){ toast("已是最新版本 v"+APP_VERSION,"ok"); }
  }).catch(function(){ if(manual) toast("检查更新失败：请检查网络后重试","bad"); });
}
function backupThenUpdate(url){
  try{ exportJson(); }catch(e){}
  toast("已导出数据备份，随后继续更新…","ok");
  setTimeout(function(){ if(url){ try{ window.open(url,"_blank"); }catch(e){} } else { reloadForUpdate(); } }, 800);
